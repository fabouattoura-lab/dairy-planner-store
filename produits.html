<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shop 💖</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Our Shop 🌸</h1>
</header>

<nav>
<a href="index.html">Home</a>
<a href="produits.html">Shop</a>
<a href="panier.html">Cart 🛒</a>
</nav>

<section class="products">

<div class="card">
<div class="badge">BEST</div>
<img src="planner1.png">
<h3>Blossom Planner</h3>
<p>1800 DA</p>
<button onclick="addToCart(1800)">Add</button>
<button onclick="location.href='product.html'">Quick View</button>
</div>

<div class="card">
<div class="badge">HOT</div>
<img src="planner2.png">
<h3>Pink Journal</h3>
<p>1600 DA</p>
<button onclick="addToCart(1600)">Add</button>
</div>

<div class="card">
<div class="badge">NEW</div>
<img src="planner3.png">
<h3>Dream Life</h3>
<p>1900 DA</p>
<button onclick="addToCart(1900)">Add</button>
</div>

</section>

<script>
let cart = localStorage.getItem("cart") || 0;
let total = localStorage.getItem("total") || 0;

function addToCart(price){
cart++;
total = Number(total) + Number(price);

localStorage.setItem("cart", cart);
localStorage.setItem("total", total);
}
</script>

</body>
</html>
