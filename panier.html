<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cart 🛒</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Your Cart 🛒</h1>
</header>

<section class="hero">

<h2>Checkout 💳</h2>

<p>Items: <span id="cart-count">0</span></p>
<p>Total: <span id="total">0</span> DA</p>

<button onclick="location.href='checkout.html'">
Go to Checkout 💳
</button>

</section>

<script>
document.getElementById("cart-count").innerText = localStorage.getItem("cart") || 0;
document.getElementById("total").innerText = localStorage.getItem("total") || 0;
</script>

</body>
</html>
