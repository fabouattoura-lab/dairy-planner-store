<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkout 💳</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Checkout 💳</h1>
</header>

<section class="hero">

<p>Items: <span id="cart-count">0</span></p>
<p>Total: <span id="total">0</span> DA</p>

<input placeholder="Full Name"><br><br>
<input placeholder="Address"><br><br>
<input placeholder="Phone"><br><br>

<button onclick="order()">Place Order 💖</button>

<p id="msg"></p>

</section>

<script>
document.getElementById("cart-count").innerText = localStorage.getItem("cart") || 0;
document.getElementById("total").innerText = localStorage.getItem("total") || 0;

function order(){
document.getElementById("msg").innerText = "Order placed ✔";
localStorage.clear();
}
</script>

</body>
</html>
